---
- name: "Install and Register GitLab Runner on k3s-server"
  hosts: all
  connection: local
  become: yes
  vars_files:
    - /vagrant/ansible/vars/secrets.yml
  vars:
    gitlab_runner_url:         "https://gitlab.com"
    gitlab_runner_description: "vroom-k3s-runner"
    gitlab_runner_tags:        "k3s,deploy,vroom"
    gitlab_runner_executor:        "docker"
    gitlab_runner_default_image:   "docker:24.0.5"
    gitlab_runner_binary_url:      "https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-linux-amd64"

  tasks:
    - name: "Ensure DNS is robust (force IPv4 nameservers)"
      shell: |
        rm -f /etc/resolv.conf
        echo "nameserver 8.8.8.8"  > /etc/resolv.conf
        echo "nameserver 1.1.1.1" >> /etc/resolv.conf
      changed_when: false

    - name: "Install Docker"
      shell: |
        curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: "Add gitlab-runner to docker group"
      user:
        name:   gitlab-runner
        groups: docker
        append: yes

    - name: "Enable and start Docker"
      systemd:
        name:    docker
        state:   started
        enabled: yes

    - name: "Download gitlab-runner binary"
      get_url:
        url:  "{{ gitlab_runner_binary_url }}"
        dest: /usr/local/bin/gitlab-runner
        mode: "0755"
        force: no  # skip if already present with same size

    - name: "Create gitlab-runner system user"
      user:
        name:        gitlab-runner
        comment:     "GitLab Runner"
        create_home: yes
        shell:       /bin/bash
        system:      yes
      register: runner_user

    - name: "Install gitlab-runner as a system service"
      command: >
        gitlab-runner install
        --user=gitlab-runner
        --working-directory=/home/gitlab-runner
      args:
        creates: /etc/systemd/system/gitlab-runner.service

    - name: "Unregister all existing runners (clean slate before re-registering)"
      command: gitlab-runner unregister --all-runners
      ignore_errors: yes

    - name: "Remove stale config.toml so registration always runs fresh"
      file:
        path: /etc/gitlab-runner/config.toml
        state: absent

    - name: "Register gitlab-runner with GitLab"
      command: >
        gitlab-runner register
        --non-interactive
        --url "{{ gitlab_runner_url }}"
        --token "{{ gitlab_runner_token }}"
        --executor "{{ gitlab_runner_executor }}"
        --description "{{ gitlab_runner_description }}"
        --docker-image "{{ gitlab_runner_default_image }}"
        --docker-privileged
        --docker-volumes /var/run/docker.sock:/var/run/docker.sock

    - name: "Fix config.toml ownership so service user can read it"
      file:
        path:  /etc/gitlab-runner
        owner: gitlab-runner
        group: gitlab-runner
        recurse: yes

    - name: "Enable and start gitlab-runner service"
      systemd:
        name:          gitlab-runner
        state:         restarted
        enabled:       yes
        daemon_reload: yes

    - name: "Verify gitlab-runner service is running"
      command: gitlab-runner status
      changed_when: false
      register: runner_status

    - name: "Show runner status"
      debug:
        msg: "{{ runner_status.stdout }}"

    - name: "Verify runner token is accepted by GitLab"
      command: gitlab-runner verify
      changed_when: false
      register: runner_verify

    - name: "Show verify result"
      debug:
        msg: "{{ runner_verify.stderr }}"
