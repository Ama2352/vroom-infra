---
- name: "Bootstrap ArgoCD + Sealed Secrets on K3s"
  hosts: k3s-server
  connection: local
  become: yes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: "Ensure DNS is robust (Force IPv4 nameservers)"
      shell: |
        rm -f /etc/resolv.conf
        echo "nameserver 8.8.8.8" > /etc/resolv.conf
        echo "nameserver 1.1.1.1" >> /etc/resolv.conf
      changed_when: false

    - name: "Wait for all nodes to be ready"
      shell: "kubectl get nodes --no-headers | grep ' Ready' | wc -l"
      register: nodes_ready
      until: nodes_ready.stdout|int >= 3
      retries: 30
      delay: 10
      changed_when: false

    - name: "Install Helm"
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: "Add Helm repos"
      shell: "helm repo add {{ item.name }} {{ item.url }}"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      loop:
        - { name: "bitnami",   url: "https://charts.bitnami.com/bitnami" }
        - { name: "argoproj",  url: "https://argoproj.github.io/argo-helm" }

    - name: "Update Helm repositories"
      shell: "helm repo update"
      register: repo_update
      until: repo_update.rc == 0
      retries: 5
      delay: 10
      changed_when: false

    - name: "Create namespaces"
      shell: |
        kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
      register: ns_create
      changed_when: "'created' in ns_create.stdout"
      loop:
        - sealed-secrets
        - argocd

    - name: "Reset stuck Sealed Secrets Helm release if pending"
      shell: |
        STATUS=$(helm status sealed-secrets -n sealed-secrets -o json 2>/dev/null \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('status',''))" 2>/dev/null || echo "")
        if [[ "$STATUS" == pending* ]]; then
          echo "Resetting stuck Helm release: $STATUS"
          kubectl get secret -n sealed-secrets -l "owner=helm,name=sealed-secrets" \
            -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | \
            xargs -r kubectl delete secret -n sealed-secrets || true
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: "Install Sealed Secrets Controller"
      shell: |
        helm upgrade --install sealed-secrets bitnami/sealed-secrets \
          --namespace sealed-secrets --wait --timeout 10m
      register: sealed_secrets_install
      until: sealed_secrets_install.rc == 0
      retries: 3
      delay: 15
      changed_when: "'upgraded' in sealed_secrets_install.stdout or 'installed' in sealed_secrets_install.stdout"

    - name: "Install Kubeseal CLI"
      shell: |
        VERSION="0.27.0"
        curl -L "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${VERSION}/kubeseal-${VERSION}-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin/ kubeseal
        chmod +x /usr/local/bin/kubeseal
      args:
        creates: /usr/local/bin/kubeseal

    - name: "Reset stuck ArgoCD Helm release if pending"
      shell: |
        STATUS=$(helm status argocd -n argocd -o json 2>/dev/null \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('status',''))" 2>/dev/null || echo "")
        if [[ "$STATUS" == pending* ]]; then
          echo "Resetting stuck Helm release: $STATUS"
          kubectl get secret -n argocd -l "owner=helm,name=argocd" \
            -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | \
            xargs -r kubectl delete secret -n argocd || true
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: "Install ArgoCD"
      shell: |
        helm upgrade --install argocd argoproj/argo-cd \
          --namespace argocd \
          --set server.insecure=true \
          --set configs.params."server.basehref"=/argocd \
          --set configs.params."server.rootpath"=/argocd \
          --wait --timeout 10m
      register: argocd_install
      until: argocd_install.rc == 0
      retries: 3
      delay: 15
      changed_when: "'upgraded' in argocd_install.stdout or 'installed' in argocd_install.stdout"

    - name: "Expose ArgoCD server as NodePort 30080"
      shell: |
        kubectl patch svc argocd-server -n argocd \
          -p '{"spec":{"type":"NodePort","ports":[{"port":443,"targetPort":8080,"nodePort":30080}]}}'
      register: patch_result
      changed_when: "'patched' in patch_result.stdout and '(no changes)' not in patch_result.stdout"

    - name: "Wait for ArgoCD initial secret"
      shell: "kubectl -n argocd get secret argocd-initial-admin-secret"
      register: secret_check
      until: secret_check.rc == 0
      retries: 12
      delay: 10
      changed_when: false

    - name: "Get ArgoCD initial password"
      shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret \
          -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      changed_when: false

    - name: "Show ArgoCD access info"
      debug:
        msg:
          - "====================================================================="
          - "🚀  ARGOCD BOOTSTRAP COMPLETE"
          - "====================================================================="
          - ""
          - "🌍 URL:      https://192.168.242.10:30080"
          - "👤 User:     admin"
          - "🔑 Password: {{ argocd_password.stdout }}"
          - ""
          - "====================================================================="

    # ── Kargo CRD Bootstrap ──────────────────────────────────────────────────
    # Kargo stores CRDs in resources/crds/ (non-standard Helm path), so ArgoCD
    # never installs them automatically. We pre-install them HERE — before the
    # root app is applied — so that ArgoCD can sync vroom-kargo-resources
    # (AnalysisTemplate, Stage, Warehouse) on the first pass without "no matches
    # for kind AnalysisTemplate" errors. Runs idempotently on every vagrant up.

    - name: "Bootstrap Kargo CRDs before root app (pre-requisite for vroom-kargo-resources sync)"
      shell: |
        KARGO_VERSION="1.10.3"
        helm pull oci://ghcr.io/akuity/kargo-charts/kargo \
          --version "${KARGO_VERSION}" \
          --untar --untardir /tmp/kargo-crd
        kubectl apply --server-side --force-conflicts \
          -f /tmp/kargo-crd/kargo/resources/crds/
        rm -rf /tmp/kargo-crd
      changed_when: true

    # Kargo v1.10.3 does NOT bundle Argo Rollouts CRDs — they live in the
    # non-standard resources/crds/ path which only contains Kargo's own CRDs.
    # AnalysisTemplate / AnalysisRun (argoproj.io/v1alpha1) must be installed
    # separately. The argoproj Helm repo is already added above, so we pull
    # the argo-rollouts chart just for its crds/ directory (no controller pod).
    - name: "Bootstrap Argo Rollouts CRDs (for Kargo Stage verification)"
      shell: |
        helm pull argoproj/argo-rollouts \
          --untar --untardir /tmp/argo-rollouts-crd
        kubectl apply --server-side --force-conflicts \
          -f /tmp/argo-rollouts-crd/argo-rollouts/crds/
        rm -rf /tmp/argo-rollouts-crd
      changed_when: true

    # Kargo's Project admission webhook rejects a Project whose namespace already
    # exists without the kargo.akuity.io/project label. ArgoCD's CreateNamespace=true
    # creates the vroom namespace before Kargo can claim it, causing a chicken-and-egg.
    # Pre-creating it with the label here means Kargo finds it already labelled.
    - name: "Pre-create vroom namespace with Kargo project label"
      shell: |
        kubectl create namespace vroom --dry-run=client -o yaml | kubectl apply -f -
        kubectl label namespace vroom kargo.akuity.io/project=true --overwrite
      args:
        executable: /bin/bash
      changed_when: false

    - name: "Apply GitOps Root App (App of Apps)"
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/Ama2352/vroom-gitops/main/root-app.yaml
      register: root_app_result
      until: root_app_result.rc == 0
      retries: 10
      delay: 15
      changed_when: "'created' in root_app_result.stdout or 'configured' in root_app_result.stdout"
