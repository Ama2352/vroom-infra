---
# seal-secrets.yml
# Seals all Vroom secrets (strict scope — bound to name+namespace) and pushes them to vroom-gitops/secrets/.
#
# Prerequisites:
#   1. Copy ansible/vars/secrets.yml.example → ansible/vars/secrets.yml and fill in real values.
#   2. Run AFTER the Sealed Secrets controller is installed (i.e., after argocd.yml).
#
# Invocation (from vroom-infra/):
#   vagrant provision k3s-server --provision-with seal-secrets
#
# Or inside the VM:
#   ansible-playbook /vagrant/ansible/playbooks/seal-secrets.yml --connection=local

- name: "Load secret variables"
  hosts: all
  connection: local
  vars_files:
    - ../vars/secrets.yml
  gather_facts: false

  vars:
    sealed_dir: /vagrant/.secrets/sealed
    gitops_dir: /tmp/vroom-gitops-sealed
    controller_name: sealed-secrets
    controller_ns: sealed-secrets

  tasks:

    # ── Controller readiness ───────────────────────────────────────────────

    - name: "Wait for Sealed Secrets controller to be ready"
      shell: kubectl rollout status deploy/sealed-secrets -n "{{ controller_ns }}" --timeout=5m
      register: ss_ready
      until: ss_ready.rc == 0
      retries: 15
      delay: 20
      changed_when: false

    # ── Create output directories ─────────────────────────────────────────

    - name: "Create sealed output namespace directories"
      file:
        path: "{{ sealed_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - vroom-dev
        - vroom-staging
        - vroom-prod
        - platform
        - monitoring
        - vroom-kargo
        - vroom

    # ── DB secrets (12 entries via template) ──────────────────────────────

    - name: "Write plaintext DB secret to temp file"
      template:
        src: ../templates/db-secret.j2
        dest: "/tmp/vroom-plain-{{ item.namespace }}-{{ item.name }}.yaml"
        mode: "0600"
      loop: "{{ db_secrets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"

    - name: "Seal DB secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < "/tmp/vroom-plain-{{ item.namespace }}-{{ item.name }}.yaml" \
          > "{{ sealed_dir }}/{{ item.namespace }}/{{ item.name }}.yaml"
      loop: "{{ db_secrets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"
      changed_when: true

    - name: "Delete plaintext DB temp files"
      file:
        path: "/tmp/vroom-plain-{{ item.namespace }}-{{ item.name }}.yaml"
        state: absent
      loop: "{{ db_secrets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"

    # ── AlertManager Slack secret ─────────────────────────────────────────

    - name: "Seal alertmanager-slack-secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: alertmanager-slack-secret
          namespace: monitoring
        type: Opaque
        stringData:
          slack-webhook-url: "{{ alertmanager_slack_webhook_url }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/monitoring/alertmanager-slack-secret.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── n8n secret ────────────────────────────────────────────────────────

    - name: "Seal n8n-secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: n8n-secret
          namespace: monitoring
        type: Opaque
        stringData:
          password: "{{ n8n_admin_password }}"
          encryption-key: "{{ n8n_encryption_key }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/monitoring/n8n-sealed-secret.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── kubectl-executor secret ───────────────────────────────────────────

    - name: "Seal kubectl-executor-secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: kubectl-executor-secret
          namespace: monitoring
        type: Opaque
        stringData:
          EXECUTOR_API_KEY: "{{ kubectl_executor_api_key }}"
          ALLOWED_NAMESPACES: "{{ kubectl_executor_allowed_namespaces }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/monitoring/kubectl-executor-secret.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── OpenRouter API key (incident-agent) ──────────────────────────────

    - name: "Seal openrouter-secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: openrouter-secret
          namespace: monitoring
        type: Opaque
        stringData:
          api-key: "{{ openrouter_api_key }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/monitoring/openrouter-secret.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── Groq API key (incident-agent) ────────────────────────────────────

    - name: "Seal groq-secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: groq-secret
          namespace: monitoring
        type: Opaque
        stringData:
          api-key: "{{ groq_api_key }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/monitoring/groq-secret.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── GitHub token (incident-agent deployment provenance) ──────────────

    - name: "Seal github-token-secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: github-token-secret
          namespace: monitoring
        type: Opaque
        stringData:
          GITHUB_TOKEN: "{{ gitops_git_creds_password }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/monitoring/github-token-secret.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── Kargo admin secret ────────────────────────────────────────────────

    - name: "Seal kargo-admin-secret"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: kargo-admin-secret
          namespace: vroom-kargo
        type: Opaque
        stringData:
          ADMIN_ACCOUNT_PASSWORD_HASH: "{{ kargo_admin_password_hash }}"
          ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: "{{ kargo_admin_token_signing_key }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/vroom-kargo/kargo-admin-password.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── Git credentials (Kargo) ───────────────────────────────────────────

    - name: "Seal gitops-git-creds"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: vroom-gitops-git-creds
          namespace: vroom
          labels:
            kargo.akuity.io/cred-type: git
        type: Opaque
        stringData:
          repoURL: "{{ gitops_git_creds_url }}"
          username: "{{ gitops_git_creds_username }}"
          password: "{{ gitops_git_creds_password }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/vroom/gitops-git-creds.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── GHCR credentials ─────────────────────────────────────────────────

    - name: "Seal ghcr-creds"
      shell: |
        kubeseal \
          --controller-name="{{ controller_name }}" \
          --controller-namespace="{{ controller_ns }}" \
          --format yaml \
          < <(cat <<'PLAINEOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: vroom-ghcr-creds
          namespace: vroom
          labels:
            kargo.akuity.io/cred-type: image
        type: Opaque
        stringData:
          repoURL: "^ghcr\\.io/ama2352/.*"
          repoURLIsRegex: "true"
          username: "{{ ghcr_creds_username }}"
          password: "{{ ghcr_creds_password }}"
        PLAINEOF
        ) > "{{ sealed_dir }}/vroom/ghcr-creds.yaml"
      args:
        executable: /bin/bash
      changed_when: true

    # ── Push to vroom-gitops ──────────────────────────────────────────────

    - name: "Clone vroom-gitops"
      git:
        repo: "https://{{ github_gitops_token }}@github.com/{{ github_gitops_repo }}.git"
        dest: "{{ gitops_dir }}"
        version: main
        force: true
      changed_when: true

    - name: "Create namespace subdirs in vroom-gitops/secrets/"
      file:
        path: "{{ gitops_dir }}/secrets/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - vroom-dev
        - vroom-staging
        - vroom-prod
        - platform
        - monitoring
        - vroom-kargo
        - vroom

    - name: "Sync sealed secrets to vroom-gitops/secrets/"
      copy:
        src: "{{ sealed_dir }}/{{ item.src }}"
        dest: "{{ gitops_dir }}/secrets/{{ item.dst }}"
        remote_src: true
      loop:
        # DB secrets
        - { src: "vroom-dev/user-db-secrets.yaml",              dst: "vroom-dev/user-db-secrets.yaml" }
        - { src: "vroom-dev/ride-db-secrets.yaml",              dst: "vroom-dev/ride-db-secrets.yaml" }
        - { src: "vroom-dev/notification-db-secrets.yaml",      dst: "vroom-dev/notification-db-secrets.yaml" }
        - { src: "vroom-staging/user-db-secrets.yaml",          dst: "vroom-staging/user-db-secrets.yaml" }
        - { src: "vroom-staging/ride-db-secrets.yaml",          dst: "vroom-staging/ride-db-secrets.yaml" }
        - { src: "vroom-staging/notification-db-secrets.yaml",  dst: "vroom-staging/notification-db-secrets.yaml" }
        - { src: "vroom-prod/user-db-secrets.yaml",             dst: "vroom-prod/user-db-secrets.yaml" }
        - { src: "vroom-prod/ride-db-secrets.yaml",             dst: "vroom-prod/ride-db-secrets.yaml" }
        - { src: "vroom-prod/notification-db-secrets.yaml",     dst: "vroom-prod/notification-db-secrets.yaml" }
        - { src: "platform/user-db-secrets.yaml",               dst: "platform/user-db-secrets.yaml" }
        - { src: "platform/ride-db-secrets.yaml",               dst: "platform/ride-db-secrets.yaml" }
        - { src: "platform/notification-db-secrets.yaml",       dst: "platform/notification-db-secrets.yaml" }
        # Infrastructure secrets
        - { src: "monitoring/alertmanager-slack-secret.yaml",   dst: "monitoring/alertmanager-slack-secret.yaml" }
        - { src: "monitoring/n8n-sealed-secret.yaml",           dst: "monitoring/n8n-sealed-secret.yaml" }
        - { src: "monitoring/kubectl-executor-secret.yaml",     dst: "monitoring/kubectl-executor-secret.yaml" }
        - { src: "monitoring/openrouter-secret.yaml",           dst: "monitoring/openrouter-secret.yaml" }
        - { src: "monitoring/groq-secret.yaml",               dst: "monitoring/groq-secret.yaml" }
        - { src: "monitoring/github-token-secret.yaml",       dst: "monitoring/github-token-secret.yaml" }
        - { src: "vroom-kargo/kargo-admin-password.yaml",       dst: "vroom-kargo/kargo-admin-password.yaml" }
        - { src: "vroom/gitops-git-creds.yaml",                 dst: "vroom/gitops-git-creds.yaml" }
        - { src: "vroom/ghcr-creds.yaml",                       dst: "vroom/ghcr-creds.yaml" }
      loop_control:
        label: "{{ item.dst }}"

    - name: "Enable all sealed secrets in kustomization.yaml"
      lineinfile:
        path: "{{ gitops_dir }}/secrets/kustomization.yaml"
        regexp: "^  # - {{ item }}"
        line: "  - {{ item }}"
        backrefs: true
      loop:
        - vroom/ghcr-creds.yaml
        - monitoring/n8n-sealed-secret.yaml
        - monitoring/kubectl-executor-secret.yaml
        - monitoring/groq-secret.yaml

    - name: "Git commit and push sealed secrets"
      shell: |
        set -e
        cd {{ gitops_dir }}
        git config user.email "ansible@vroom-infra"
        git config user.name "Vroom Ansible"
        git add secrets/
        echo "--- git status after add ---"
        git status
        if git diff --cached --quiet; then
          echo "NOTICE: No changes staged — sealed files are identical to repo. Skipping commit."
        else
          git commit -m "chore: re-seal secrets after cluster recreation"
          echo "--- commit created ---"
          git push origin main
          echo "--- push complete ---"
        fi
      args:
        executable: /bin/bash
      register: git_result
      changed_when: "'commit created' in git_result.stdout"

    - name: "Clean up vroom-gitops clone"
      file:
        path: "{{ gitops_dir }}"
        state: absent

    # ── Summary ───────────────────────────────────────────────────────────

    - name: "Sealed secrets summary"
      debug:
        msg:
          - "================================================================"
          - "SEALED SECRETS PUSHED TO github.com/{{ github_gitops_repo }}"
          - "================================================================"
          - "ArgoCD will auto-sync the vroom-secrets Application within ~3 min."
          - "Sealed files also saved locally in: {{ sealed_dir }}/"
          - "================================================================"
