---
- name: "Install K3s Server (Control Plane)"
  hosts: localhost
  become: yes
  vars:
    k3s_version: "v1.27.0"

  tasks:
    - name: "Download & install K3s server (Auto-generated token)"
      shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        sh - --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: "Wait for K3s API to be ready"
      shell: kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: result
      until: result.rc == 0
      retries: 20
      delay: 10
      
    - name: "Extract node token for agents"
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: server_token

    - name: "Save token to shared folder"
      copy:
        content: "{{ server_token.content | b64decode }}"
        dest: /vagrant/ansible/node-token
        mode: '0644'

    - name: "Copy kubeconfig to vagrant folder for host access"
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /vagrant/ansible/k3s.yaml
        remote_src: yes
