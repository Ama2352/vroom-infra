---
# seal-secrets.yml
# Imported at the end of argocd.yml after the Sealed Secrets controller is installed.
# Fetches the cluster public cert, seals every plaintext secret, and writes
# sealed files to /vagrant/.secrets/sealed/ mirroring their vroom-gitops paths.
# Run apply-sealed-secrets.ps1 on the Windows host afterward to push to GitHub.

- name: "Wait for Sealed Secrets controller to be ready"
  shell: |
    kubectl rollout status deploy/sealed-secrets -n sealed-secrets --timeout=5m
  register: ss_ready
  until: ss_ready.rc == 0
  retries: 15
  delay: 20
  changed_when: false

- name: "Fetch Sealed Secrets public certificate"
  shell: |
    kubeseal --fetch-cert \
      --controller-name=sealed-secrets \
      --controller-namespace=sealed-secrets \
      > /vagrant/.secrets/pub-cert.pem
  changed_when: true

- name: "Create sealed output directories"
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /vagrant/.secrets/sealed/apps/user/overlays/dev/secrets
    - /vagrant/.secrets/sealed/apps/ride/overlays/dev/secrets
    - /vagrant/.secrets/sealed/apps/notification/overlays/dev/secrets
    - /vagrant/.secrets/sealed/apps/user/overlays/staging/secrets
    - /vagrant/.secrets/sealed/apps/ride/overlays/staging/secrets
    - /vagrant/.secrets/sealed/apps/notification/overlays/staging/secrets
    - /vagrant/.secrets/sealed/apps/user/overlays/prod/secrets
    - /vagrant/.secrets/sealed/apps/ride/overlays/prod/secrets
    - /vagrant/.secrets/sealed/apps/notification/overlays/prod/secrets
    - /vagrant/.secrets/sealed/apps/ai-reporter/secrets
    - /vagrant/.secrets/sealed/infrastructure/postgres/secrets
    - /vagrant/.secrets/sealed/infrastructure/observability/metrics
    - /vagrant/.secrets/sealed/infrastructure/kargo/secrets
    - /vagrant/.secrets/sealed/kargo/secrets

- name: "Seal vroom-dev service secrets"
  shell: |
    kubeseal --cert /vagrant/.secrets/pub-cert.pem \
      --scope strict --format yaml \
      < /vagrant/.secrets/vroom-dev/{{ item.src }} \
      > /vagrant/.secrets/sealed/{{ item.dst }}
  loop:
    - src: user-db-secrets.yaml
      dst: apps/user/overlays/dev/secrets/user-db-secrets.yaml
    - src: ride-db-secrets.yaml
      dst: apps/ride/overlays/dev/secrets/ride-db-secrets.yaml
    - src: notification-db-secrets.yaml
      dst: apps/notification/overlays/dev/secrets/notification-db-secrets.yaml
  changed_when: true

- name: "Seal vroom-staging service secrets"
  shell: |
    kubeseal --cert /vagrant/.secrets/pub-cert.pem \
      --scope strict --format yaml \
      < /vagrant/.secrets/vroom-staging/{{ item.src }} \
      > /vagrant/.secrets/sealed/{{ item.dst }}
  loop:
    - src: user-db-secrets.yaml
      dst: apps/user/overlays/staging/secrets/user-db-secrets.yaml
    - src: ride-db-secrets.yaml
      dst: apps/ride/overlays/staging/secrets/ride-db-secrets.yaml
    - src: notification-db-secrets.yaml
      dst: apps/notification/overlays/staging/secrets/notification-db-secrets.yaml
  changed_when: true

- name: "Seal vroom-prod service secrets"
  shell: |
    kubeseal --cert /vagrant/.secrets/pub-cert.pem \
      --scope strict --format yaml \
      < /vagrant/.secrets/vroom-prod/{{ item.src }} \
      > /vagrant/.secrets/sealed/{{ item.dst }}
  loop:
    - src: user-db-secrets.yaml
      dst: apps/user/overlays/prod/secrets/user-db-secrets.yaml
    - src: ride-db-secrets.yaml
      dst: apps/ride/overlays/prod/secrets/ride-db-secrets.yaml
    - src: notification-db-secrets.yaml
      dst: apps/notification/overlays/prod/secrets/notification-db-secrets.yaml
  changed_when: true

- name: "Seal platform (Postgres init) secrets"
  shell: |
    kubeseal --cert /vagrant/.secrets/pub-cert.pem \
      --scope strict --format yaml \
      < /vagrant/.secrets/platform/{{ item.src }} \
      > /vagrant/.secrets/sealed/{{ item.dst }}
  loop:
    - src: user-db-secrets.yaml
      dst: infrastructure/postgres/secrets/user-db-secrets.yaml
    - src: ride-db-secrets.yaml
      dst: infrastructure/postgres/secrets/ride-db-secrets.yaml
    - src: notification-db-secrets.yaml
      dst: infrastructure/postgres/secrets/notification-db-secrets.yaml
  changed_when: true

- name: "Seal monitoring secrets"
  shell: |
    kubeseal --cert /vagrant/.secrets/pub-cert.pem \
      --scope strict --format yaml \
      < /vagrant/.secrets/monitoring/{{ item.src }} \
      > /vagrant/.secrets/sealed/{{ item.dst }}
  loop:
    - src: alertmanager-slack-secret.yaml
      dst: infrastructure/observability/metrics/alertmanager-slack-secret.yaml
    - src: ai-reporter-secret.yaml
      dst: apps/ai-reporter/secrets/ai-reporter-secret.yaml
  changed_when: true

- name: "Seal Kargo admin secret"
  shell: |
    kubeseal --cert /vagrant/.secrets/pub-cert.pem \
      --scope strict --format yaml \
      < /vagrant/.secrets/kargo/kargo-admin-secrets.yaml \
      > /vagrant/.secrets/sealed/infrastructure/kargo/secrets/kargo-admin-password.yaml
  changed_when: true

- name: "Seal vroom namespace secrets (Kargo)"
  shell: |
    kubeseal --cert /vagrant/.secrets/pub-cert.pem \
      --scope strict --format yaml \
      < /vagrant/.secrets/vroom/ai-reporter-secret-sealed.yaml \
      > /vagrant/.secrets/sealed/kargo/secrets/ai-reporter-secret.yaml
  changed_when: true

- name: "Show sealed secrets summary"
  debug:
    msg:
      - "====================================================================="
      - "SEALED SECRETS WRITTEN TO .secrets/sealed/"
      - "====================================================================="
      - ""
      - "Next step (run on Windows host after vagrant up):"
      - "  cd vroom-infra"
      - "  .\\scripts\\apply-sealed-secrets.ps1"
      - ""
      - "This copies sealed files to vroom-gitops and pushes to GitHub."
      - "====================================================================="
